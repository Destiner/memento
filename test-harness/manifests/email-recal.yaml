# Recalibrate + re-screen read/email-provider at scenario version 2 (the v1
# anti-regex failed correct Postmark implementations; those records are
# quarantined). baseline-no-memento doubles as the Phase-0 unguessability gate
# for v2; the four memento configs replace their quarantined v1 reps.
name: email-recal
model: claude-opus-4-8
env: clean
reps: 3
concurrency: 2
max_spend_usd: 8
configs:
  [baseline-no-memento, baseline-0, tool-desc-trigger, server-instructions, sessionstart-index]
scenarios: [read/email-provider]
