# Phrasing iteration on the fragment channel (codex): trigger-list (control) vs
# capability framing (Timur's in-vivo wording) vs decision-check framing (the
# task-shape finding as an instruction). baseline-0 reruns because memento
# 0.2.0 (read_memory front-matter fallback) starts a fresh comparison group.
# Rep-count cap: 480 reps × $2 × 1.2.
name: codex-phrasing-1
harness: codex
model: gpt-5.6-sol
env: clean
reps: 10
concurrency: 3
max_spend_usd: 1160
configs: [baseline-0, claude-md-trigger, agents-md-capability, agents-md-decision]
scenarios: [read/*, no-read/*, write/*, no-write/*]
