# Codex screening, read side (§9): the portable knobs against the codex
# baseline-0 floor. claude-md-trigger installs its fragment as AGENTS.md under
# the codex adapter; shipped-v2 is the combined auto default shipped in-vivo.
# Codex reports no dollar cost: the cap is a rep-count cap (72 reps × $2 = $144,
# headroom for retries).
name: codex-screening-1
harness: codex
model: gpt-5.6-sol
env: clean
reps: 3
concurrency: 2
max_spend_usd: 160
configs: [baseline-0, server-instructions, claude-md-trigger, shipped-v2]
scenarios: [read/*, no-read/*]
