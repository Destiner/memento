# Phase 1 screening, write side (§9): first capture-knob data. baseline-0 anchors
# the write-side floor (its only prior write data was voided with screening-1);
# result-nudges and claude-md-trigger act on both sides (their read screening runs
# separately); stop-capture-gate is the write-only hard gate.
name: screening-3
model: claude-opus-4-8
env: clean
reps: 3
concurrency: 2
max_spend_usd: 30
configs: [baseline-0, result-nudges, claude-md-trigger, stop-capture-gate]
scenarios: [write/*, no-write/*]
