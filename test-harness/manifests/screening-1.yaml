# Optional single-knob read-side screening after calibration. The runner errors
# before spending if any config or scenario cannot resolve.
name: screening-1
model: claude-opus-4-8
env: clean # clean | crowded (§3.3)
reps: 3
concurrency: 2
max_spend_usd: 60
configs:
  [baseline-0, baseline-no-memento, tool-desc-trigger, server-instructions, sessionstart-index]
scenarios: [read/*, no-read/*] # globs over scenario ids
