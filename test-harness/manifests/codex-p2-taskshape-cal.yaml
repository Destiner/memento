# discarded by run label.
name: codex-p2-taskshape-cal
harness: codex
model: gpt-5.6-sol
env: clean
reps: 5
concurrency: 3
max_spend_usd: 25
configs: [baseline-no-memento]
scenarios: [read-kq/*]
