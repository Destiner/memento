# Claude-side task-shape spike: does the codex headline (knowledge-shaped
# phrasing 0/10 → 9/10 on a bare install) replicate on claude-opus-4-8? Both
# read-kq variants passed CC calibration on the three-root sandbox (0/5, no
# file access). Runs on memento 0.2.0 — the first read data with a working
# read_memory fallback.
name: cc-taskshape
harness: claude-code
model: claude-opus-4-8
env: clean
reps: 10
concurrency: 2
max_spend_usd: 40
configs: [baseline-0, claude-md-trigger, shipped-v2-agents]
scenarios: [read-kq/*]
